#-------------------------------
# Site Settings
baseURL = "https://lukasziegler.com/"
locale  = "en"
title   = "Lukas Ziegler"

defaultContentLanguage = "en"

#-------------------------------
# Global Params
[params]
  description = "Product Designer & Handpan Facilitator"
  currency    = "Euros"

#-------------------------------
# Languages
# EN is default (no suffix needed in filenames)
# DE files use the .de.md suffix, e.g. my-event.de.md
[languages]
  [languages.en]
    label  = "English"
    weight = 1
  [languages.de]
    label  = "Deutsch"
    weight = 2

#-------------------------------
# Navigation
[menu]
  [[menu.main]]
    identifier = "home"
    name       = "Home"
    url        = "/"
    weight     = 1

  [[menu.main]]
    identifier = "design"
    name       = "Design"
    url        = "/design/"
    weight     = 2

  [[menu.main]]
    identifier = "sound"
    name       = "Sound"
    url        = "/sound/"
    weight     = 3

  [[menu.main]]
    identifier = "events"
    name       = "Events"
    url        = "/events/"
    weight     = 4

  [[menu.main]]
    identifier = "more"
    name       = "More"
    url        = "/more/"
    weight     = 5
    hasChildren = true

    [[menu.main]]
      parent = "more"
      name   = "About"
      url    = "/more/about/"
      weight = 1

    [[menu.main]]
      parent = "more"
      name   = "Contact"
      url    = "/more/contact/"
      weight = 2

    [[menu.main]]
      parent = "more"
      name   = "Imprint"
      url    = "/more/imprint/"
      weight = 3

    [[menu.main]]
      parent = "more"
      name   = "Privacy Policy"
      url    = "/more/privacy/"
      weight = 4

#-------------------------------
# Markup
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences  = true
    guessSyntax = true
    noClasses   = false
