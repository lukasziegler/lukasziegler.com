#-------------------------------
# Site Settings
baseURL = "https://lukasziegler.com/"
title   = "Lukas Ziegler"
theme   = "avenco"

defaultContentLanguage = "en"

#-------------------------------
# Pagination
[pagination]
  pagerSize = 6

#-------------------------------
# Global Params
[params]
  description = "Product Designer & Handpan Facilitator"
  currency    = "Euros"
  logo        = ""   # e.g. "/img/logo.svg"

#-------------------------------
# Cover image (used in header/footer background)
[params.global.image]
  enable       = false
  cover__image = ""

#-------------------------------
# Author / Hero section (homepage)
[params.author]
  author__name   = "Lukas Ziegler"
  author__title  = "Product Designer & Handpan Facilitator"
  author__bio    = "For more than 20 years, I've followed my passion — and along the way, discovered new sides and interests of myself. I approach everything I do with an open and curious mind, learning and evolving with each step. I see (work) life as a lifelong journey, where passion and curiosity show the way."
  author__image  = ""   # e.g. "/img/lukas.jpg"
  author__avatar = ""
  button__text   = "See my work"

#-------------------------------
# Projects section (homepage + /projects/)
[params.projects]
  enable               = true
  projects__title      = "Selected <span class='text-span'>Work</span>"
  projects__description = ""

#-------------------------------
# Blog section — disabled until /reads/ is wired up
[params.blog]
  enable = false

#-------------------------------
# Testimonials — not used
[params.testimonials]
  enable = false

#-------------------------------
# Contact form — disabled for now
[params.contact]
  enable = false

#-------------------------------
# Mailing list — disabled until provider is chosen
[params.mailchimp]
  enable = false

#-------------------------------
# Comments — not used
[params.disqus]
  enable = false

#-------------------------------
# Social links (footer)
[[params.social]]
  icon = "ion-logo-instagram"
  name = "Instagram"
  link = "https://instagram.com/lukasziegler"

[[params.social]]
  icon = "ion-logo-linkedin"
  name = "LinkedIn"
  link = "https://linkedin.com/in/lukasziegler"

#-------------------------------
# Languages
# EN is default (no suffix needed in filenames)
# DE files use the .de.md suffix, e.g. my-event.de.md
[languages]
  [languages.en]
    label        = "English"
    languageCode = "en"
    weight       = 1
  [languages.de]
    label        = "Deutsch"
    languageCode = "de"
    weight       = 2

#-------------------------------
# Navigation
[menu]
  [[menu.main]]
    identifier = "home"
    name       = "Home"
    url        = "/"
    weight     = 1

  [[menu.main]]
    identifier = "design"
    name       = "Design"
    url        = "/projects/"
    weight     = 2

  [[menu.main]]
    identifier = "sound"
    name       = "Sound"
    url        = "/sound/"
    weight     = 3

  [[menu.main]]
    identifier = "events"
    name       = "Events"
    url        = "/events/"
    weight     = 4

  [[menu.main]]
    identifier = "more"
    name       = "More"
    url        = "/more/"
    weight     = 5
    hasChildren = true

    [[menu.main]]
      parent = "more"
      name   = "About"
      url    = "/more/about/"
      weight = 1

    [[menu.main]]
      parent = "more"
      name   = "Contact"
      url    = "/more/contact/"
      weight = 2

    [[menu.main]]
      parent = "more"
      name   = "Imprint"
      url    = "/more/imprint/"
      weight = 3

    [[menu.main]]
      parent = "more"
      name   = "Privacy Policy"
      url    = "/more/privacy/"
      weight = 4

#-------------------------------
# Markup
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences  = true
    guessSyntax = true
    noClasses   = false
